[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hibiscus"
version = "0.1.0"
description = "Age-varying SNP heritability and the genetic-correlation surface from a sparse GRM"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Shuang Song", email = "shuangsong@hsph.harvard.edu"}]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/shuangsong0110/HIBISCUS"

[tool.setuptools]
packages = ["hibiscus"]
